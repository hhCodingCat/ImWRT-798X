name: ImmortalWrt-25.12固件构建

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      device_model:
        description: '选择设备型号'
        type: choice
        required: true
        default: 'cmcc_rax3000m'
        options:
          - cmcc_rax3000m
          - xiaomi_mi-router-ax3000t
          - glinet_gl-mt3000
          - xiaomi_redmi-router-ax6000-stock
      enable_ebpf_kmods:
        description: '启用 eBPF 常用内核模块 (kmod-sched-bpf / kmod-veth / kmod-xdp-sockets-diag/kmod-nft-queue/kmod-nfnetlink-queue)'
        required: false
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds-25.12.conf.default
  CONFIG_FILE: mt7981-ax3000.config
  DIY_P1_SH: scripts/diy-part1.sh
  DIY_P2_SH: scripts/diy-part2.sh
  TZ: Asia/Shanghai
  UPLOAD_FIRMWARE: 'true'
  ENABLE_EBPF_KMODS: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_ebpf_kmods }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 基础环境检查
        uses: actions/checkout@v4

      - name: 释放磁盘空间 & 安装编译依赖
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update -y -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl ccache pahole
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /workdir && sudo chown $USER:$USER /workdir

      - name: 克隆源码
        working-directory: /workdir
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 同步外部自定义文件 (files)
        run: |
          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            mkdir -p openwrt/files
            cp -rf "$GITHUB_WORKSPACE/files/"* openwrt/files/ 2>/dev/null || true
            echo "✅ 已同步外部自定义文件至 openwrt/files"
          fi

      - name: 缓存加速
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-25.12-${{ github.event.inputs.device_model || 'cmcc_rax3000m' }}-${{ hashFiles('openwrt/include/**') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-25.12-${{ github.event.inputs.device_model || 'cmcc_rax3000m' }}-

      - name: 更新 Feeds & 执行 DIY 脚本
        run: |
          cd openwrt
          [ -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ] && cp "$GITHUB_WORKSPACE/$FEEDS_CONF" ./feeds.conf.default

          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH && $GITHUB_WORKSPACE/$DIY_P1_SH

          ./scripts/feeds update -a && ./scripts/feeds install -a

          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH && $GITHUB_WORKSPACE/$DIY_P2_SH

      - name: 生成 .config & 下载软件包
        run: |
          cd openwrt
          [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ] && cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          
          # 清理旧设备多目标配置，确保单设备纯净构建
          sed -i '/CONFIG_TARGET_DEVICE_/d' .config || true
          sed -i '/CONFIG_TARGET_mediatek_filogic_DEVICE_/d' .config || true
          sed -i '/CONFIG_TARGET_MULTI_PROFILE/d' .config || true
          DEVICE="${{ github.event.inputs.device_model }}"
          [ -z "$DEVICE" ] && DEVICE="cmcc_rax3000m"
          echo "CONFIG_TARGET_MULTI_PROFILE=n" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${DEVICE}=y" >> .config
          echo "CONFIG_CCACHE=y" >> .config

          # 按需追加 eBPF 模块支持
          if [ "${{ env.ENABLE_EBPF_KMODS }}" = "true" ]; then
            echo "CONFIG_KERNEL_CGROUP_BPF=y" >> .config
            echo "CONFIG_KERNEL_XDP_SOCKETS=y" >> .config
            echo "CONFIG_PACKAGE_kmod-sched-bpf=y" >> .config
            echo "CONFIG_PACKAGE_kmod-veth=y" >> .config
            echo "CONFIG_PACKAGE_kmod-xdp-sockets-diag=y" >> .config
            echo "CONFIG_PACKAGE_kmod-nft-queue=y" >> .config
            echo "CONFIG_PACKAGE_kmod-nfnetlink-queue=y" >> .config
            echo "CONFIG_PACKAGE_bpftool=y" >> .config
          fi

          # 启用原生内核 BTF 调试符号 (honk/dae 核心需求，保持 host toolchain 默认不下载冗余 LLVM 工具链)
          echo "CONFIG_KERNEL_DEBUG_INFO=y" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO_BTF=y" >> .config
          echo "CONFIG_KERNEL_DEBUG_INFO_REDUCED=n" >> .config
          
          make defconfig
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 3G
          ccache -z
          
          THREADS=$(( $(nproc) + 1 ))
          echo "系统 CPU 核心数: $(nproc), 编译线程数: $THREADS"
          
          make -j$THREADS || make -j1 V=s
          ccache -s

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-25.12-${{ github.event.inputs.device_model || 'cmcc_rax3000m' }}
          path: |
            openwrt/logs/**/*
            openwrt/*.log
          if-no-files-found: ignore

      - name: 收集与整理固件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages 2>/dev/null || true
          
          DATE_DISPLAY=$(date +'%Y%m%d %H:%M')
          DATE_FILE=$(date +'%Y%m%d_%H%M')
          
          DEVICE="${{ github.event.inputs.device_model }}"
          [ -z "$DEVICE" ] && DEVICE="cmcc_rax3000m"

          echo "DATE=$DATE_DISPLAY" >> $GITHUB_ENV
          echo "FIRMWARE_VERSION=$(date +%Y%m%d)" >> $GITHUB_ENV
          echo "device_code=$DEVICE" >> $GITHUB_ENV
          
          # 提取 sysupgrade 固件并标准化命名
          for file in *; do
            [ -f "$file" ] && [[ "$file" != *-bl2* && "$file" != *-recovery* && "$file" != *-sha256sums* ]] && [[ $file == *sysupgrade* ]] && {
              EXT="${file##*.}"
              NEW_NAME="immortalwrt-25.12-${DEVICE}-${DATE_FILE}-sysupgrade.${EXT}"
              mv "$file" "$NEW_NAME"
              echo "✅ 固件就绪: $NEW_NAME"
            }
          done
          
          # 精简清理无关 eMMC 文件，仅保留 NAND 运行与引导文件
          rm -f *emmc* *recovery* *-bl2* *sha256sums* 2>/dev/null || true
          sha256sum *sysupgrade* > sha256sums 2>/dev/null || true
          
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 删除旧 Release Assets
        if: steps.organize.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const device = context.payload.inputs?.device_model || 'cmcc_rax3000m';
            const tag = `Latest-25.12-${device}`;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: tag
              });
              for (const asset of release.data.assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
              console.log(`✅ 已删除 ${release.data.assets.length} 个旧固件`);
            } catch (e) {
              console.log("第一次发布或无旧文件，跳过删除");
            }

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        with:
          tag_name: Latest-25.12-${{ github.event.inputs.device_model || 'cmcc_rax3000m' }}
          files: ${{ env.FIRMWARE_PATH }}/*
          overwrite_files: true
          body: |
            ## ImmortalWrt-25.12 固件发布 (官方原版 · 支持 BTF/honk)
            - **目标设备**: ${{ github.event.inputs.device_model || 'cmcc_rax3000m' }} (NAND)
            - **内置主题**: luci-theme-aurora
            - **文件共享**: KSMBD (Linux 内核态极速 SMB)
            - **无线驱动**: MTK 原生闭源驱动 mt_wifi (官方默认)
            - **内核 BTF / eBPF**: 已原生支持 (CONFIG_KERNEL_DEBUG_INFO_BTF=y, kmod-sched-bpf, bpftool, honk 兼容)
            - **体积优化**: 1024K SquashFS 极致压缩
            - **编译时间**: ${{ env.DATE }}
            - **默认后台**: 192.168.2.1 / 无密码
