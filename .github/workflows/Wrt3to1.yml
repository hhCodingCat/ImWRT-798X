name: Wrt 多版本固件构建

on:
  workflow_dispatch:
    inputs:
      source_version:
        description: '选择源码版本'
        required: true
        type: choice
        default: '24.10-6.6'
        options:
          - '24.10-6.6'       # padavanonly/immortalwrt-mt798x-24.10 @ openwrt-24.10-6.6
          - '25.10-dev'       # chasey-dev/immortalwrt-mt798x-rebase @ 25.12-dev
          - '25.12-tag'       # shiyu1314/openwrt-source @ latest v25.* tag

      devices:
        description: '设备型号（多个用逗号分隔，无空格，例如：cmcc_rax3000m,xiaomi_mi-router-ax3000t）'
        required: true
        type: string
        default: 'cmcc_rax3000m'

      enable_5g_highpower:
        description: '启用5G高功率模式 (25dB)'
        type: boolean
        default: true

      custom_ip:
        description: 'LAN IP 地址（默认 192.168.2.1）'
        type: string
        default: '192.168.2.1'

      custom_author:
        description: '固件作者/签名（显示在 Release 描述中）'
        type: string
        default: '自定义高功率版'

      custom_plugins:
        description: '额外 LuCI 插件（空格分隔，例如：luci-app-ksmbd luci-theme-argon）'
        type: string
        default: ''

  # schedule:
  #   - cron: '35 5 * * 1'   # 可选：每周一自动构建（建议先注释掉）

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  UPLOAD_RELEASE: true
  UPLOAD_WEBDAV: true
  WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
  WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
  WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      repo_url: ${{ steps.set-vars.outputs.repo_url }}
      repo_branch: ${{ steps.set-vars.outputs.repo_branch }}
      is_tag_mode: ${{ steps.set-vars.outputs.is_tag_mode }}
      diyp1: ${{ steps.set-vars.outputs.diyp1 }}
      diyp2: ${{ steps.set-vars.outputs.diyp2 }}
      config_file: ${{ steps.set-vars.outputs.config_file }}
    steps:
      - id: set-vars
        run: |
          case "${{ inputs.source_version }}" in
            "24.10-6.6")
              echo "repo_url=https://github.com/padavanonly/immortalwrt-mt798x-24.10" >> $GITHUB_OUTPUT
              echo "repo_branch=openwrt-24.10-6.6" >> $GITHUB_OUTPUT
              echo "is_tag_mode=false" >> $GITHUB_OUTPUT
              echo "diyp1=scripts/diy-part1.sh" >> $GITHUB_OUTPUT
              echo "diyp2=scripts/diy-part2.sh" >> $GITHUB_OUTPUT
              echo "config_file=config/24.10-6.6.config" >> $GITHUB_OUTPUT
              ;;
            "25.10-dev")
              echo "repo_url=https://github.com/chasey-dev/immortalwrt-mt798x-rebase" >> $GITHUB_OUTPUT
              echo "repo_branch=25.12-dev" >> $GITHUB_OUTPUT
              echo "is_tag_mode=false" >> $GITHUB_OUTPUT
              echo "diyp1=scripts/diy-part1.sh" >> $GITHUB_OUTPUT
              echo "diyp2=scripts/diy-part3.sh" >> $GITHUB_OUTPUT
              echo "config_file=config/mt7981-ax3000.config" >> $GITHUB_OUTPUT
              ;;
            "25.12-tag")
              echo "repo_url=https://github.com/shiyu1314/openwrt-source" >> $GITHUB_OUTPUT
              echo "repo_branch=openwrt-25.12" >> $GITHUB_OUTPUT
              echo "is_tag_mode=true" >> $GITHUB_OUTPUT
              echo "diyp1=scripts/diy-part4.sh" >> $GITHUB_OUTPUT
              echo "diyp2=" >> $GITHUB_OUTPUT
              echo "config_file=config/op25.config" >> $GITHUB_OUTPUT
              ;;
          esac

      - id: set-matrix
        run: |
          devices=$(echo "${{ inputs.devices }}" | tr -d ' ')
          jq -n --argjson devs "$(echo "$devices" | jq -R 'split(",")')" '{ "device": $devs }' > matrix.json
          cat matrix.json
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10
    env:
      DEVICE: ${{ matrix.device }}
      SOURCE_VERSION: ${{ inputs.source_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 释放磁盘空间 & 安装编译环境
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ccache subversion patch \
            asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 \
            texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool \
            autopoint gperf coreutils haveged scons rename qemu-utils
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo mkdir -p /workdir && sudo chown $USER:$USER /workdir
          df -h

      - name: 克隆源码 & 切换到对应分支或 tag
        working-directory: /workdir
        run: |
          git clone --depth=1 ${{ needs.prepare.outputs.repo_url }} openwrt
          cd openwrt
          git checkout ${{ needs.prepare.outputs.repo_branch }}
          if [ "${{ needs.prepare.outputs.is_tag_mode }}" = "true" ]; then
            LATEST_TAG=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
            git checkout $LATEST_TAG
            echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: 执行 DIY 脚本
        working-directory: /workdir/openwrt
        run: |
          chmod +x ${{ github.workspace }}/${{ needs.prepare.outputs.diyp1 }} || true
          ${{ github.workspace }}/${{ needs.prepare.outputs.diyp1 }} || true
          if [ -n "${{ needs.prepare.outputs.diyp2 }}" ]; then
            chmod +x ${{ github.workspace }}/${{ needs.prepare.outputs.diyp2 }} || true
            ${{ github.workspace }}/${{ needs.prepare.outputs.diyp2 }} || true
          fi

      - name: 强制注入高功率 EEPROM (如果启用)
        if: inputs.enable_5g_highpower == 'true'
        working-directory: /workdir/openwrt
        run: |
          # 根据版本选择不同的高功率注入方式（这里是示例，需你根据实际情况调整）
          if [ "${{ inputs.source_version }}" = "25.10-dev" ]; then
            # chasey-dev 风格：替换文件 + 修改标识位
            SOURCE_EEPROM="${{ github.workspace }}/files/MT7981_iPAiLNA_EEPROM.bin"
            if [ -f "$SOURCE_EEPROM" ]; then
              printf '\x34\xca' | dd of="$SOURCE_EEPROM" bs=1 seek=4 conv=notrunc
              find . -name "MT7981_iPAiLNA_EEPROM.bin" -exec cp -f "$SOURCE_EEPROM" {} \;
              mkdir -p package/mtk/drivers/mt7981-firmware/files/
              cp -f "$SOURCE_EEPROM" package/mtk/drivers/mt7981-firmware/files/
            fi
          else
            # padavanonly 风格或其他方式（自行补充偏移修改逻辑）
            echo "高功率 EEPROM 处理（24.10 风格） - 请补充实际逻辑"
          fi

      - name: 生成 .config 并应用自定义设置
        working-directory: /workdir/openwrt
        run: |
          cat << EOF >> .config
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_${{ matrix.device }}=y
          CONFIG_CCACHE=y
          EOF

          # 替换默认 IP
          sed -i 's/192.168.1.1/${{ inputs.custom_ip }}/g' package/base-files/files/bin/config_generate

          # 自定义插件
          for pkg in ${{ inputs.custom_plugins }}; do
            if [ -n "$pkg" ]; then
              echo "CONFIG_PACKAGE_$pkg=y" >> .config
            fi
          done

          # 加载预设 config 文件（如果存在）
          if [ -f "../${{ needs.prepare.outputs.config_file }}" ]; then
            cat "../${{ needs.prepare.outputs.config_file }}" >> .config
          fi

          make defconfig
          make download -j$(nproc) || make download -j8

      - name: 编译固件
        working-directory: /workdir/openwrt
        run: |
          make -j$(nproc) V=s || make -j$(nproc) V=s IGNORE_ERRORS="n m" || make -j8 V=s

      - name: 整理输出文件 & 生成版本信息
        id: organize
        working-directory: /workdir/openwrt/bin/targets/*/*
        run: |
          rm -rf packages *.buildinfo *.manifest sha256sums *-bl2* *-recovery* || true

          SUFFIX="stock"
          [ "${{ inputs.enable_5g_highpower }}" = "true" ] && SUFFIX="25dB-on"

          DATE_TAG=$(date +'%Y%m%d_%H%M')
          for file in *sysupgrade*.*; do
            [ -f "$file" ] || continue
            EXT="${file##*.}"
            NEW_NAME="${{ matrix.device }}_${SUFFIX}_${DATE_TAG}_sysupgrade.${EXT}"
            mv "$file" "$NEW_NAME"
          done

          echo "FIRMWARE_PATH=$(pwd)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布到 GitHub Releases
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ inputs.source_version }}-${{ matrix.device }}-${{ env.RELEASE_TAG || env.BUILD_DATE }}"
          name: "${{ inputs.source_version }} - ${{ matrix.device }} (${{ env.BUILD_DATE }})"
          body: |
            **源码版本**: ${{ inputs.source_version }}
            **设备**: ${{ matrix.device }}
            **构建时间**: ${{ env.BUILD_DATE }}
            **IP**: ${{ inputs.custom_ip }}
            **高功率**: ${{ inputs.enable_5g_highpower && '已启用' || '未启用' }}
            **作者**: ${{ inputs.custom_author }}
            **插件**: ${{ inputs.custom_plugins || '默认' }}
          files: ${{ env.FIRMWARE_PATH }}/*
          overwrite: true

      - name: 上传到 WebDAV
        if: env.UPLOAD_WEBDAV == 'true' && env.WEBDAV_URL != '' && steps.organize.outputs.status == 'success'
        run: |
          cd ${{ env.FIRMWARE_PATH }}
          curl -u "${{ env.WEBDAV_USERNAME }}:${{ env.WEBDAV_PASSWORD }}" -X MKCOL "${{ env.WEBDAV_URL }}/ImmortalWrt-${{ inputs.source_version }}/" || true
          for file in *; do
            [ -f "$file" ] && curl -u "${{ env.WEBDAV_USERNAME }}:${{ env.WEBDAV_PASSWORD }}" -T "$file" "${{ env.WEBDAV_URL }}/ImmortalWrt-${{ inputs.source_version }}/$file"
          done
